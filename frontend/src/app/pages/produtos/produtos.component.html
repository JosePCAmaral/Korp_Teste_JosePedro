<div class="produtos-container">
  <mat-card>
    <mat-card-title>Cadastro de Produto</mat-card-title>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="salvar()" class="form-produto">
        <mat-form-field appearance="outline">
          <mat-label>Descrição</mat-label>
          <input matInput formControlName="descricao">
        </mat-form-field>

        <button mat-stroked-button type="button" (click)="sugerirCodigo()" [disabled]="gerandoSugestao" class="btn-ia">
          <mat-spinner *ngIf="gerandoSugestao" diameter="18" class="btn-spinner"></mat-spinner>
          {{ gerandoSugestao ? 'Gerando...' : 'Gerar código com IA' }}
        </button>

        <mat-form-field appearance="outline">
          <mat-label>Código</mat-label>
          <input matInput formControlName="codigo">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Saldo</mat-label>
          <input matInput type="number" formControlName="saldo">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || salvando">
          <mat-spinner *ngIf="salvando" diameter="18" class="btn-spinner"></mat-spinner>
          {{ salvando ? 'Salvando...' : 'Cadastrar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-title>Produtos cadastrados</mat-card-title>
    <mat-card-content>
      <mat-spinner *ngIf="carregandoProdutos" diameter="32"></mat-spinner>

      <table mat-table [dataSource]="produtos" class="mat-elevation-z2" *ngIf="!carregandoProdutos && produtos.length > 0">
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let p">{{ p.codigo }}</td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef>Descrição</th>
          <td mat-cell *matCellDef="let p">{{ p.descricao }}</td>
        </ng-container>

        <ng-container matColumnDef="saldo">
          <th mat-header-cell *matHeaderCellDef>Saldo</th>
          <td mat-cell *matCellDef="let p" [ngClass]="{ 'saldo-zero': p.saldo === 0, 'saldo-baixo': p.saldo > 0 && p.saldo <= 5 }">{{ p.saldo }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
      </table>

      <p class="empty-state" *ngIf="!carregandoProdutos && !erroAoCarregarProdutos && produtos.length === 0">Nenhum produto cadastrado ainda.</p>
      <p class="empty-state" *ngIf="!carregandoProdutos && erroAoCarregarProdutos">Não foi possível carregar a lista de produtos.</p>
    </mat-card-content>
  </mat-card>
</div>
